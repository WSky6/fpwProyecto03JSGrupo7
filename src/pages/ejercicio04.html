            <option value="elección">-- Seleccione un género --</option>

            <option value="Comedia">Comedia</option>
            <option value="Drama">Drama</option>
        </select>
        <button id="btnFiltrar">Filtrar</button>

    <div>
        <select id="filtroPuntaje">
            <option value="elección02">-- Seleccione un puntaje --</option>

        </select>
        <button id="btnFiltrarPuntaje">Filtrar por Puntaje</button>
    </div>
    

    <div>
        <h3><strong>Filtrado de Genero</strong></h3>
        <ul id="listaPeliculas"></ul> 
    </div>
    <div>
        <h3><strong>Filtrado por Puntaje</strong></h3>
